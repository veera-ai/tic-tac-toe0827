<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Tic Tac Toe</title>
    <meta name="description" content="A simple Tic Tac Toe game built with TypeScript." />
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root {
        --bg: #ffffff;
        --fg: #111111;
        --muted: #666666;
        --accent: #2563eb;
        --grid: #e5e7eb;
        --cell-hover: #f3f4f6;
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      html, body, #app {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      }
      .container {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .game {
        width: 100%;
        max-width: 420px;
        display: grid;
        gap: 16px;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .title {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: 0.2px;
      }
      .controls {
        display: flex;
        gap: 8px;
      }
      button {
        appearance: none;
        border: 1px solid var(--grid);
        background: #fff;
        color: var(--fg);
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 0.95rem;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease, transform 0.02s ease;
      }
      button:hover { background: #f9fafb; }
      button:active { transform: translateY(1px); }
      button.primary {
        background: var(--accent);
        color: white;
        border-color: var(--accent);
      }
      button.primary:hover { filter: brightness(0.98); }
      .status {
        font-size: 0.95rem;
        color: var(--muted);
      }
      .board {
        width: 100%;
        aspect-ratio: 1 / 1;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .cell {
        background: #fff;
        border: 1px solid var(--grid);
        border-radius: 10px;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: clamp(2rem, 10vw, 3rem);
        cursor: pointer;
        user-select: none;
        transition: background 0.15s ease, border-color 0.15s ease, transform 0.02s ease;
      }
      .cell:hover { background: var(--cell-hover); }
      .cell.disabled { cursor: default; color: var(--muted); }
      .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .sr-only {
        position: absolute;
        width: 1px; height: 1px;
        padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0,0,0,0);
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="app" class="container">
      <noscript>You need JavaScript enabled to run this app.</noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
